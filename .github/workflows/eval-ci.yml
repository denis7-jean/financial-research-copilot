name: Financial Copilot Offline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Billable checks require separate owner run/cost authorization.
# Passing offline CI does not establish qualification or deployment readiness.
jobs:
  packaging-contract:
    # Synthetic wheel/installer checks, NOT Lambda-native build/import evidence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging test tools only
        run: pip install pytest==9.0.3 boto3==1.42.96 httpx==0.28.1 python-dotenv==1.2.2 packaging==25.0
      - name: Guarded synthetic packaging checks
        run: python -B -m pytest tests/test_lambda_package.py -q
  offline:
    runs-on: ubuntu-latest
    env:
      # Block only unrelated telemetry plugins; keep async and conftest discovery.
      PYTEST_ADDOPTS: "-p no:logfire -p no:pytest_logfire"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Verification runtime; target 3.11 still needs Linux runtime validation.
          python-version: "3.13.12"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Offline guarded lint
        run: python -B -c "from tests.offline_guard import install; install(); import runpy; runpy.run_module('ruff', run_name='__main__')" check conftest.py app/ eval/ tests/ scripts/ experiments/
      - name: Verify installed offline pytest plugin entry points
        run: |
          python -B - <<'PY'
          from importlib.metadata import distribution
          expected = {
              "logfire": {"logfire": "logfire.testing", "pytest_logfire": "logfire._internal.integrations.pytest"},
              "pytest-asyncio": {"asyncio": "pytest_asyncio.plugin"},
              "anyio": {"anyio": "anyio.pytest_plugin"},
          }
          for name, required in expected.items():
              dist = distribution(name)
              actual = {ep.name: ep.value for ep in dist.entry_points if ep.group == "pytest11"}
              print(name, dist.version, actual)
              assert actual == required, (name, actual, required)
          PY
      - name: Guarded synthetic regressions
        run: python -B -m pytest --trace-config tests/ -m "not llm and not integration" -k "not test_accepted_population_regression" -q
      - name: Synthetic comparison smoke
        run: python -B -m experiments.jev_candidate.smoke
